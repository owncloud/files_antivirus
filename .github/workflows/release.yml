name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
    uses: owncloud/reusable-workflows/.github/workflows/release.yml@main
    with:
      app-name: files_antivirus
      artifact-glob: build/artifacts/appstore/files_antivirus.tar.gz
    secrets:
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      SIGNING_CERT: ${{ secrets.SIGNING_CERT }}
      SIGNING_CHAIN: ${{ secrets.SIGNING_CHAIN }}
